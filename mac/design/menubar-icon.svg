<!--
  Kingtime mark: the King crown above a clock face.
  Source for the menu bar icons. Black + alpha only: macOS uses the alpha
  channel and tints it, so it works in light and dark mode. Same 24-unit
  canvas and 22pt size as the KingProgress menu bar icon, so the two read as
  siblings. Render with:
    rsvg-convert -w 22 -h 22 mac/design/menubar-icon.svg > mac/Kingtime/Assets.xcassets/MenuBarIcon.imageset/menubar.png
    rsvg-convert -w 44 -h 44 mac/design/menubar-icon.svg > mac/Kingtime/Assets.xcassets/MenuBarIcon.imageset/menubar@2x.png
-->
<svg width="44" height="44" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m6 3.25 3.25 2L12 1.75l2.75 3.5 3.25-2-1.25 4.5h-9.5Z" fill="#000" stroke="none"/>
    <path d="M6.25 9.5a7.5 7.5 0 1 0 11.5 0"/>
    <path d="M12 10.75v4l3 1.75"/>
  </g>
</svg>
